name: Tokenotch checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.classify.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Native checks run unless every changed file is documentation-only.
          native=true
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" HEAD)"
            if [[ -n "$changed" ]]; then
              native=false
              while IFS= read -r file; do
                case "$file" in
                  docs/design/tokenotch-notch-logo.png|docs/design/tokenotch-logo-app-icon.png) native=true ;;
                  docs/*|scripts/docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md) ;;
                  .github/CODEOWNERS|.github/workflows/docs.yml|.markdownlint-cli2.jsonc|lychee.toml) ;;
                  */*) native=true ;;
                  *.md) ;;
                  *) native=true ;;
                esac
                echo "$file"
              done <<< "$changed"
            fi
          fi
          echo "Native checks required: $native"
          echo "native=$native" >> "$GITHUB_OUTPUT"
  test:
    needs: changes
    # A skipped job satisfies the required check; classification failures still run everything.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version && xcrun swift --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/VSCode/package-lock.json
      - name: Verify release metadata and logo provenance
        run: make metadata
      - name: Unit and native regression tests
        timeout-minutes: 15
        run: make test-ci
      - name: Repeat native UI timing regressions
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            echo "Native UI timing pass $attempt"
            xcrun swift test --skip-build --filter 'NotchWaitTests|HistoryPresentationTests|testIdleAutoHideAndHoverExpansion'
          done
      - name: Content-stripping and local IPC smoke checks
        run: make smoke
      - name: Telemetry and source-aware history checks
        run: make smoke-telemetry
      - name: Native app and lifecycle checks
        run: make smoke-history smoke-timeline smoke-notch
      - name: Verify universal development bundle
        run: |
          make universal
          python3 scripts/verify-bundle.py build/Tokenotch.app --universal
      - name: Build and verify development installers
        run: python3 scripts/package.py --skip-build
      - name: Install and launch on the fresh Apple Silicon runner
        timeout-minutes: 5
        run: |
          (cd build/packages && shasum -a 256 -c Tokenotch.dmg.sha256 Tokenotch.pkg.sha256)
          xcrun swiftc -swift-version 5 -parse-as-library scripts/install-smoke.swift -o build/tokenotch-install-smoke
          build/tokenotch-install-smoke
      - name: Ensure optional signed releases still require approval
        run: |
          if python3 scripts/release.py --signed --check; then
            echo "Signed release accepted without approval/signing configuration"
            exit 1
          fi
      - name: Keep verified installers for native Intel acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-development-installers
          path: |
            build/packages/Tokenotch.dmg
            build/packages/Tokenotch.dmg.sha256
            build/packages/Tokenotch.pkg
            build/packages/Tokenotch.pkg.sha256
          if-no-files-found: error
          retention-days: 3
  install-intel:
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-development-installers
          path: build/packages
      - name: Install and launch the exact verified installers on Intel
        timeout-minutes: 5
        run: |
          uname -m
          xcodebuild -version
          (cd build/packages && shasum -a 256 -c Tokenotch.dmg.sha256 Tokenotch.pkg.sha256)
          xcrun swiftc -swift-version 5 -parse-as-library scripts/install-smoke.swift -o build/tokenotch-install-smoke
          build/tokenotch-install-smoke
