name: Diagnose native test startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Sample test discovery if it stalls
        run: |
          xcrun swift build --build-tests
          python3 - <<'PY'
          import pathlib
          import subprocess
          process = subprocess.Popen(["xcrun", "swift", "test", "list", "--skip-build"])
          try:
              process.wait(timeout=60)
          except subprocess.TimeoutExpired:
              rows = subprocess.check_output(["ps", "-axo", "pid,ppid,command"], text=True).splitlines()
              descendants = {process.pid}
              for _ in range(10):
                  for row in rows:
                      fields = row.strip().split(None, 2)
                      if len(fields) == 3 and fields[0].isdigit() and int(fields[1]) in descendants:
                          descendants.add(int(fields[0]))
              for pid in sorted(descendants):
                  if pid != process.pid:
                      subprocess.run(["sample", str(pid), "2", "-file", f"/tmp/test-{pid}.sample"], check=False)
                      print(pathlib.Path(f"/tmp/test-{pid}.sample").read_text(), flush=True)
              for pid in sorted(descendants, reverse=True):
                  subprocess.run(["kill", "-TERM", str(pid)], check=False)
              process.wait(timeout=10)
              raise SystemExit("Test discovery stalled; sampled its child processes.")
          raise SystemExit(process.returncode)
          PY
