name: Windows development checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Windows ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          architecture: ${{ matrix.architecture }}
          cache: npm
          cache-dependency-path: windows/desktop/package-lock.json
      - name: Select native pinned Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          rustup set default-host ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select native Rust host.' }
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install pinned Rust toolchain.' }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot activate pinned Rust toolchain.' }
      - name: Publication and packaging regression checks
        run: |
          python scripts/test-project.py
          if ($LASTEXITCODE -ne 0) { throw 'Publication regression checks failed.' }
          python scripts/test-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata checks failed.' }
          python windows/tests/test_packaging.py
          if ($LASTEXITCODE -ne 0) { throw 'Payload architecture checks failed.' }
      - name: Build and package unsigned development app
        run: ./windows/scripts/package.ps1 -Architecture ${{ matrix.architecture }} -Development
      - name: Browser presentation checks
        run: |
          Push-Location windows/desktop
          try {
            npx --no-install playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed.' }
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw 'Browser presentation checks failed.' }
          } finally { Pop-Location }
      - name: Verify disposable installation
        run: |
          $files = @(Get-ChildItem build/windows/${{ matrix.architecture }} -Filter '*-setup.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected one architecture-specific installer.' }
          ./windows/scripts/verify-install.ps1 -Architecture ${{ matrix.architecture }} -Installer $files[0].FullName -DisposableEnvironment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenotch-windows-${{ matrix.architecture }}-development-${{ github.sha }}
          path: build/windows/${{ matrix.architecture }}/
          if-no-files-found: error
