name: Bug Report
description: Report a Tokenotch issue with version and redacted diagnostic information.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us investigate.
        Do not report vulnerabilities here; read SECURITY.md for private reporting.
        Use synthetic examples and inspect diagnostics/screenshots before sharing.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Tokenotch with local client '...'
        2. Perform action '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Affected integration
      description: Which local Copilot client or subsystem is experiencing issues?
      options:
        - Copilot CLI (local)
        - VS Code Local Preview hooks
        - VS Code model/token usage
        - Account quota or sign-in
        - History, timelines or session notices
        - Public service health
        - Notification policy
        - UI / Notch Presentation
        - Settings / Preferences
        - Other
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment & macOS Version
      description: e.g., macOS Sequoia 15.0, Apple Silicon M3 / Intel
      placeholder: "macOS 15.0 (Apple Silicon)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tokenotch and client versions
      description: App commit/version, CLI version or VS Code and Copilot extension versions.
      placeholder: "Tokenotch 1.0.0 (build); client version..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: |
        Preview and copy diagnostics from Tokenotch Settings. Do not include prompts, tokens, paths or transcripts.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the problem here.
    validations:
      required: false
