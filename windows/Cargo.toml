[workspace]
members = ["core", "platform", "hook", "desktop/src-tauri"]
default-members = ["core"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/rottathiago/tokenotch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true
