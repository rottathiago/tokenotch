[package]
name = "tokenotch-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokenotch-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "process", "macros"] }
getrandom = "0.3"
rusqlite = { version = "0.38", features = ["bundled", "serialize", "limits", "hooks"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Media_Audio", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "UI_Notifications", "UI_ViewManagement"] }
tauri-winrt-notification = "0.8.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
