name: Tokenotch
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  TokenotchCore:
    type: library.static
    platform: macOS
    sources: [sources/Core]
    dependencies:
      - sdk: libsqlite3.tbd
  TokenotchHook:
    type: tool
    platform: macOS
    sources: [sources/Hook]
    dependencies:
      - target: TokenotchCore
  Tokenotch:
    type: application
    platform: macOS
    sources:
      - path: sources
        excludes: [Core, Hook]
      - path: integrations/CopilotUsage
        type: folder
        buildPhase: resources
      - path: integrations/VSCode/TokenotchVSCode.vsix
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: config/Release.json
        buildPhase: resources
    dependencies:
      - target: TokenotchCore
      - target: TokenotchHook
        embed: false
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_TokenotchDistributionChannel: development
    configFiles:
      Debug: config/Release.xcconfig
      Release: config/Release.xcconfig
    postBuildScripts:
      - name: Embed hook helper
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/TokenotchHook" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/TokenotchHook"
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/TokenotchHook"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/TokenotchHook"]
  TokenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [tests]
    dependencies:
      - target: Tokenotch
      - target: TokenotchCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tokenotch:
    build:
      targets:
        Tokenotch: all
    test:
      targets: [TokenotchTests]
